
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Macacadas: A Última Ressaca</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100e20;color:white;font-family:monospace;overflow:hidden;touch-action:none}
#game{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;max-height:850px;object-fit:fill;image-rendering:pixelated;background:#17152d}
#hud{position:fixed;top:12px;left:3%;right:3%;display:flex;gap:12px;align-items:center;text-shadow:2px 2px #000}
.panel{flex:1;min-width:0}
.name{font-size:clamp(10px,2.8vw,15px);margin-bottom:5px}
.bar{height:15px;background:#34243d;border:2px solid white}
.fill{height:100%;width:100%;background:#ff354f;transition:width .2s}
#enemybar .fill{background:#f6b83e}
#timer{font-size:20px;color:#ffe66d}
#message{position:fixed;top:34%;width:100%;text-align:center;font-size:clamp(22px,6vw,38px);font-weight:bold;color:#ffe66d;text-shadow:3px 3px #a22245;pointer-events:none}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 5%;gap:12px}
.group{display:flex;gap:9px;align-items:center}
.btn{width:clamp(48px,13vw,70px);height:clamp(48px,13vw,70px);border:3px solid #fff8;border-radius:14px;background:#24213bdc;color:white;font-size:22px;font-weight:bold;box-shadow:0 5px #090815;touch-action:none}
.btn:active{background:#d12b50;transform:translateY(3px);box-shadow:0 2px #090815}
.attack{background:#b52348e8}
#hint{position:fixed;bottom:105px;width:100%;text-align:center;font-size:10px;color:#d9d5ed;pointer-events:none}
</style>
</head>
<body>
<div id="game"><canvas id="c" width="480" height="270"></canvas></div>
<div id="hud">
 <div class="panel"><div class="name">🔥 MIGUEL</div><div class="bar"><div id="hp" class="fill"></div></div></div>
 <div id="timer">99</div>
 <div class="panel" id="enemybar"><div class="name" style="text-align:right">😈 RIVAL</div><div class="bar"><div id="ehp" class="fill"></div></div></div>
</div>
<div id="message">MACACADAS!<br><span style="font-size:13px">A ÚLTIMA RESSACA</span></div>
<div id="hint">DERROTE O RIVAL!</div>
<div id="controls">
 <div class="group">
  <button class="btn" data-key="left">◀</button>
  <button class="btn" data-key="right">▶</button>
  <button class="btn" data-key="jump">⬆</button>
 </div>
 <div class="group">
  <button class="btn attack" data-key="kick">🦵</button>
  <button class="btn attack" data-key="punch">👊</button>
 </div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
x.imageSmoothingEnabled=false;
const W=480,H=270;
let keys={},started=false,over=false,frame=0,time=99;
let player={x:105,y:205,hp:100,face:1,vy:0,attack:0,cool:0};
let enemy={x:365,y:205,hp:100,face:-1,attack:0,cool:0};
const rect=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
function background(){
 let g=x.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#24264b');g.addColorStop(1,'#ee795e');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 rect(0,147,W,123,'#302b49');
 // Lua e estrelas
 rect(365,34,25,25,'#ffe8a3');rect(373,28,25,25,'#24264b');
 for(let i=0;i<24;i++)rect((i*79)%W,(i*37)%125,2,2,'#fff0c0');
 // prédios
 for(let i=0;i<8;i++){
 let bx=i*65-8,bh=48+(i*29)%55;
 rect(bx,147-bh,53,bh,'#29263e');
 rect(bx+5,153-bh,43,3,'#55405c');
 for(let j=0;j<3;j++)for(let k=0;k<3;k++)
 rect(bx+8+j*13,160-bh+k*14,6,7,(i+j+k)%3?'#ffbf70':'#665b85');
 }
 // chão e calçada
 rect(0,207,W,63,'#49334a');rect(0,207,W,4,'#f5ad70');
 for(let i=0;i<9;i++)rect(i*62+((frame*.5)%62),226,32,2,'#705064');
 // lata e garrafas
 rect(36,192,10,15,'#51c7ac');rect(39,188,4,4,'#c8e8b5');
 rect(430,196,8,11,'#f3c65e');
}
function fighter(p,hero){
 let xx=Math.round(p.x),yy=Math.round(p.y);
 rect(xx-13,yy+1,27,5,'#211b31');
 // pernas
 rect(xx-10,yy-21,8,19,'#26283e');
 rect(xx+2,yy-21,8,19,'#26283e');
 rect(xx-13,yy-5,12,5,'#e8b69a');
 rect(xx+2,yy-5,12,5,'#e8b69a');
 // tronco
 rect(xx-14,yy-45,28,25,hero?'#d92139':'#4267a9');
 rect(xx-14,yy-45,28,4,hero?'#f44852':'#71a5ed');
 // camisa Flamengo: listras
 if(hero){
  rect(xx-8,yy-41,4,18,'#171722');
  rect(xx,yy-41,4,18,'#171722');
  rect(xx+8,yy-41,3,18,'#171722');
  rect(xx-3,yy-35,6,6,'#f9d66a');
 }else{
  rect(xx-8,yy-39,16,3,'#d8e2ff');
 }
 // braços
 rect(xx-20,yy-42,7,19,'#e8b69a');
 rect(xx+13,yy-42,7,19,'#e8b69a');
 // cabeça e cabelo
 rect(xx-10,yy-60,20,17,'#e8b69a');
 rect(xx-11,yy-63,22,8,hero?'#30251f':'#171523');
 rect(xx-11,yy-57,4,8,hero?'#30251f':'#171523');
 // olhos
 rect(xx+p.face*4-2,yy-54,3,3,'#241d2b');
 // punho de ataque
 if(p.attack>0){
  let dir=p.face;
  rect(xx+dir*14-5,yy-41,dir*20+10,8,'#e8b69a');
  rect(xx+dir*26,yy-45,10,15,'#ffe66d');
 }
}
function draw(){
 background();
 // placas neon
 rect(20,133,99,3,'#ec4775');rect(20,136,3,13,'#ec4775');
 rect(347,133,110,3,'#59e5d1');
 // personagens
 if(player.x<enemy.x){fighter(player,true);fighter(enemy,false)}
 else{fighter(enemy,false);fighter(player,true)}
}
function hit(){
 let dist=Math.abs(player.x-enemy.x);
 if(dist<61 && player.face===(enemy.x>player.x?1:-1)){
  enemy.hp=Math.max(0,enemy.hp-(keys.kick?15:10));
  enemy.x+=player.face*8;
  document.getElementById('ehp').style.width=enemy.hp+'%';
  if(enemy.hp===0)finish(true);
 }
}
function finish(win){
 over=true;
 document.getElementById('message').innerHTML=win?'🏆 VITÓRIA!<br><span style="font-size:14px">O REI DA RESSACA!</span>':'💀 Nocauteado!<br><span style="font-size:14px">TOQUE PARA RECOMEÇAR</span>';
 if(win)document.getElementById('hint').textContent='MIGUEL DOMINOU A NOITE!';
}
function reset(){
 player={x:105,y:205,hp:100,face:1,vy:0,attack:0,cool:0};
 enemy={x:365,y:205,hp:100,face:-1,attack:0,cool:0};
 time=99;over=false;started=true;frame=0;
 document.getElementById('hp').style.width='100%';
 document.getElementById('ehp').style.width='100%';
 document.getElementById('message').textContent='';
 document.getElementById('hint').textContent='DERROTE O RIVAL!';
}
function update(){
 frame++;
 if(!started||over){draw();return}
 if(keys.left)player.x-=2;
 if(keys.right)player.x+=2;
 player.x=Math.max(20,Math.min(460,player.x));
 player.face=enemy.x>player.x?1:-1;
 if(keys.jump&&player.y>=205)player.vy=-7;
 player.vy+=.35;player.y=Math.min(205,player.y+player.vy);
 if(player.y===205)player.vy=0;
 if(player.cool>0)player.cool--;
 if(player.attack>0)player.attack--;
 if((keys.punch||keys.kick)&&player.cool===0){
  player.attack=8;player.cool=18;hit();
 }
 if(enemy.cool>0)enemy.cool--;
 if(enemy.attack>0)enemy.attack--;
 if(Math.abs(enemy.x-player.x)>42)enemy.x+=enemy.x>player.x?-.65:.65;
 else if(enemy.cool===0){
  enemy.attack=8;enemy.cool=42;
  player.hp=Math.max(0,player.hp-7);
  document.getElementById('hp').style.width=player.hp+'%';
  if(player.hp===0)finish(false);
 }
 if(frame%60===0){time--;document.getElementById('timer').textContent=time;if(time<=0)finish(player.hp>=enemy.hp)}
 draw();
}
document.querySelectorAll('.btn').forEach(b=>{
 let k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{keys[k]=false}));
});
document.getElementById('message').addEventListener('click',()=>{if(!started||over)reset()});
c.addEventListener('click',()=>{if(!started||over)reset()});
draw();
setInterval(update,1000/30);
</script>
</body>
</html>
